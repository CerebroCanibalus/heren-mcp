# Cargo config del workspace Heren MCP.
# Equipo nuevo (2026-09): VS 2026 BuildTools (18) MSVC 14.51.36231 + Windows SDK 10.0.26100.0.
# El VS 2022 BuildTools (14.44) ya no existe en este equipo; se fija el toolset actual.
# Ver rutas con:
#   cmd /c "call \"C:\Program Files (x86)\Microsoft Visual Studio\18\BuildTools\Common7\Tools\VsDevCmd.bat\" -arch=x64 && set LIB"

[target.x86_64-pc-windows-msvc]
linker = "C:/Program Files (x86)/Microsoft Visual Studio/18/BuildTools/VC/Tools/MSVC/14.51.36231/bin/HostX64/x64/link.exe"

[env]
# Rutas LIB del toolset MSVC 14.51 + Windows SDK 10.0.26100.0.
# (Las dobles barras en TOML = una barra literal de Windows.)
LIB = "C:/Program Files (x86)/Microsoft Visual Studio/18/BuildTools/VC/Tools/MSVC/14.51.36231/lib/x64;C:/Program Files (x86)/Windows Kits/10/lib/10.0.26100.0/ucrt/x64;C:/Program Files (x86)/Windows Kits/10/lib/10.0.26100.0/um/x64"