name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  rust:
    name: Rust tests + clippy + fmt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all -- -D warnings

      - name: cargo test
        run: cargo test --all

  gdscript-headless:
    name: GDScript headless validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.6.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.6.1-stable_linux.x86_64.zip
          mv Godot_v4.6.1-stable_linux.x86_64 godot
          chmod +x godot
          sudo mv godot /usr/local/bin/godot

      - name: Copy plugin into fixture
        run: cp -r addons fixtures/empty_project/

      - name: Validate plugin graph headless (parse errors break it)
        run: |
          godot --headless --editor --path fixtures/empty_project --quit-after 60 2>&1 | tee /tmp/godot-graph.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/godot-graph.log; then
            echo "::error::Plugin graph has parse errors"
            exit 1
          fi

      - name: Run GDScript unit tests
        run: |
          godot --headless --path fixtures/empty_project --script res://addons/heren/tests/run_tests.gd 2>&1 | tee /tmp/godot-tests.log
          if ! grep -q "RESULT: 10 passed, 0 failed" /tmp/godot-tests.log; then
            echo "::error::GDScript unit tests failed"
            exit 1
          fi

  python-lint:
    name: Python lint (active scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check scripts/
        run: ruff check scripts/

      - name: ruff format --check scripts/
        run: ruff format --check scripts/
