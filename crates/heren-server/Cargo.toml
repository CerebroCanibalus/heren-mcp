[package]
name = "heren-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

description = "Heren MCP v4 — Godot EditorPlugin bridge (FlojoMCP dogfooding)"

[dependencies]
# FlojoMCP (framework MCP casero): temporalmente por path al workspace
# hermano; al publicar flojo-mcp@0.1.0 a crates.io se cambia a version.
flojo-mcp = { path = "../../../../ClaudeMCPs/FlojoMCP/crates/flojo-mcp", features = ["ws-server", "session"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { workspace = true }

[[bin]]
name = "heren-server"
path = "src/main.rs"

[dev-dependencies]
tokio-tungstenite = "0.26"
futures = "0.3"
criterion = "0.5"
tempfile = "3.27.0"

[[bench]]
name = "pure_helpers"
harness = false
